<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Using Functions</title>
    <style>
        body {
            background-color: lightpink;
        }

        h1 {
            text-align: center;
            color: azure;
        }

        #show {
            font-size: 50px;
            color: white;
            text-align: center;
            padding-top: 50px;
        }
    </style>
</head>

<body>
    <h1>Multiplication Using Functions 🧮</h1>
    <div id="show"></div>
    <script>
        function sum(a, b) {
            return a * b;
        }
        document.getElementById("show").textContent = sum(2, 5);

    </script>
</body>

</html>
